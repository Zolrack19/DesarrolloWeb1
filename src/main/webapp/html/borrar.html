<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modal Cliente</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

  <div class="flex items-center justify-between p-4 bg-white border rounded-lg shadow-md">
    <div class="text-sm text-gray-600">
      Mostrando filas <span id="pagInicio" class="font-semibold">21</span> a <span id="pagFin" class="font-semibold">40</span> de <span class="font-semibold">200</span>
    </div>
  
    <div class="flex items-center space-x-2">
      <button
        class="px-3 py-1 text-sm text-gray-700 bg-gray-100 border border-gray-300 rounded hover:bg-gray-200 disabled:opacity-50"
        onclick="goToPreviousPage()"
        id="prevButton"
      >
        ← Anterior
      </button>
  
      <button
        class="px-3 py-1 text-sm text-gray-700 bg-gray-100 border border-gray-300 rounded hover:bg-gray-200 disabled:opacity-50"
        onclick="goToNextPage()"
        id="nextButton"
      >
        Siguiente →
      </button>
    </div>
  </div>
  


</body>

</html>
