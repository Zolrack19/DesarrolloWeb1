<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modal Cliente</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

<!-- Nivel 1 (0 o 1 solicitud): Muy disponible -->
<span class="inline-block px-2 py-1 text-xs font-semibold rounded-full bg-green-100 text-green-700">
  Muy disponible
</span>

<!-- Nivel 2 (2 solicitudes): Disponible -->
<span class="inline-block px-2 py-1 text-xs font-semibold rounded-full bg-lime-100 text-lime-700">
  Disponible
</span>

<!-- Nivel 3 (3 solicitudes): Moderadamente ocupado -->
<span class="inline-block px-2 py-1 text-xs font-semibold rounded-full bg-yellow-100 text-yellow-700">
  Moderado
</span>

<!-- Nivel 4 (4 solicitudes): Casi lleno -->
<span class="inline-block px-2 py-1 text-xs font-semibold rounded-full bg-orange-100 text-orange-700">
  Casi al límite
</span>

<!-- Nivel 5 (5 solicitudes): Ocupado -->
<span class="inline-block px-2 py-1 text-xs font-semibold rounded-full bg-red-100 text-red-700">
  Sin disponibilidad
</span>



</body>

</html>
