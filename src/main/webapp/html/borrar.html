<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modal Cliente</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1"></script>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }

    canvas {
      max-width: 600px;
    }
  </style>
</head>
<!-- scale-100  opacity-0 -->

<body>

  <header class="flex justify-between items-center px-6 py-4 border-b border-gray-500">
    <nav class="flex gap-6">
      <p id="pnlSolicitudes" class="cursor-pointer text-pink-600 font-semibold border-b-2 border-pink-600 pb-1">
        <span>Solicitudes</span>
      </p>
      <p id="pnlClientes" class="cursor-pointer hover:text-red-600 border-pink-600 pb-1">
        <span>Clientes</span>
      </p>
      <p id="pnlColaboradores" class="cursor-pointer hover:text-red-600 border-pink-600 pb-1">
        <span>Colaboradores</span>
      </p>
      <p id="pnlColaboradores" class="cursor-pointer hover:text-red-600 border-pink-600 pb-1">
        <span>Mis solicitudes</span>
      </p>
    </nav>

  </header>

  <div class="flex justify-end gap-4 px-6 py-4 border-b border-gray-100">

    <div class="w-[180px]">
      <label class="block text-sm font-medium text-gray-700 mb-1">Mes</label>
      <select id="mesCombo"
        class="w-full border border-gray-300 rounded-md shadow-sm px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-pink-500">
        <option value="-1" selected>-- Solo año --</option>
        <option value="0">Enero</option>
        <option value="1">Febrero</option>
        <option value="2">Marzo</option>
        <option value="3">Abril</option>
        <option value="4">Mayo</option>
        <option value="5">Junio</option>
        <option value="6">Julio</option>
        <option value="7">Agosto</option>
        <option value="8">Septiembre</option>
        <option value="9">Octubre</option>
        <option value="10">Noviembre</option>
        <option value="11">Diciembre</option>
      </select>
    </div>

    <div class="w-[180px]">
      <label class="block text-sm font-medium text-gray-700 mb-1">Año</label>
      <div
        class="flex items-center justify-between border border-gray-300 rounded-md shadow-sm px-3 py-2 text-sm focus-within:ring-2 focus-within:ring-pink-500">
        <button id="decrementAnio" class="text-gray-500 hover:text-red-500 focus:outline-none">◀</button>
        <span id="anioSeleccionado" class="font-medium text-gray-800 select-none">2025</span>
        <button id="incrementAnio" class="text-gray-500 hover:text-green-500 focus:outline-none">▶</button>
      </div>
    </div>

  </div>


  <div class="bg-gray-100 pt-6">

    <div class="container mx-auto space-y-6">

      <h2 class="text-base font-medium text-gray-700 text-2xl mb-2">Criterios de búsqueda específica</h2>
      <div class="flex flex-col md:flex-row items-stretch md:items-center gap-7 mt-2 mb-4">
        <!-- Selector de tipo -->
        <div class="w-full md:w-40">
          <select id="tipoBusqueda"
            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">Todas las solicitudes</option>
            <option value="1">Por colaborador</option>
            <option value="2">Por cliente</option>
          </select>
        </div>

        <!-- Campo de texto -->
        <div class="relative w-full">
          <div
            class="flex items-center justify-between w-full px-3 py-1 bg-gray-50 border border-gray-300 rounded-md shadow-sm">
            Pedro Picapiedra Roca
            <button
              class="text-gray-600 hover:text-white hover:bg-red-500 bg-gray-200 rounded-full px-2 text-xl transition-all duration-200">
              &times;
            </button>
          </div>



          <input type="text" id="txtBuscar" placeholder="Buscar entidad"
            class="w-full md:flex-1 px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
          <ul id="popupResultados" tabindex="1"
            class="absolute z-10 w-full mt-1 bg-white border border-gray-300 rounded-md shadow-md max-h-40 overflow-y-auto hidden">
          </ul>
        </div>

        <!-- Botón -->
        <button type="button"
          class="whitespace-nowrap w-full md:w-auto px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:ring-2 focus:ring-blue-300"
          id="btnVerEstadistica">
          Ver estadísticas
        </button>
      </div>

      <div class="bg-white rounded-xl shadow p-4">
        <canvas id="canvas1" class="w-full h-64"></canvas>
      </div>

      <div class="flex gap-4">

        <div class="w-1/2 bg-white rounded-xl shadow p-4">
          <canvas id="canvas2" class="w-full h-64"></canvas>
        </div>

        <div class="w-1/2 bg-white rounded-xl shadow p-4">
          <canvas id="canvas3" class="w-full h-64"></canvas>
        </div>

      </div>

    </div>

  </div>

  <h2>Solicitudes por día</h2>
  <canvas id="miGrafico"></canvas>

  <script>

    let anio = new Date().getFullYear();
    const spanAnio = document.getElementById("anioSeleccionado");
    const btnInc = document.getElementById("incrementAnio");
    const btnDec = document.getElementById("decrementAnio");

    spanAnio.textContent = anio;

    btnInc.addEventListener("click", () => {
      anio++;
      spanAnio.textContent = anio;
    });

    btnDec.addEventListener("click", () => {
      anio--;
      spanAnio.textContent = anio;
    });

    function getFechaSeleccionada() {
      const mes = document.getElementById("mesCombo").value; // 0 = enero
      return { mes: parseInt(mes), anio };
    }


    const datos = [
      { fecha: '2025-07-01', cantidad: 3 },
      { fecha: '2025-07-02', cantidad: 5 },
      { fecha: '2025-07-03', cantidad: 2 },
      { fecha: '2025-07-04', cantidad: 7 },
      { fecha: '2025-07-05', cantidad: 4 },
    ];

    const ctx = document.getElementById('miGrafico').getContext('2d');

    new Chart(ctx, {
      type: 'line',
      data: {
        datasets: [{
          label: 'Solicitudes por día',
          data: datos.map(d => ({ x: d.fecha, y: d.cantidad })),
          borderColor: 'rgba(75, 192, 192, 1)',
          backgroundColor: 'rgba(75, 192, 192, 0.3)',
          tension: 0.3,
          pointRadius: 4,
          fill: true
        }]
      },
      options: {
        responsive: true,
        scales: {
          x: {
            type: 'time',
            time: {
              unit: 'day', // Cambia a 'week' o 'month' si quieres
              tooltipFormat: 'dd LLL yyyy'
            },
            title: {
              display: true,
              text: 'Fecha'
            }
          },
          y: {
            beginAtZero: true,
            title: {
              display: true,
              text: 'Cantidad de solicitudes'
            }
          }
        }
      }
    });
