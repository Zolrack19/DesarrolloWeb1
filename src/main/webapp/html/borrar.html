<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modal Cliente</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
  <div class="relative w-64">
    <input
      type="text"
      placeholder="Buscar..."
      class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring focus:ring-blue-200"
      oninput="showSuggestions(this.value)"
      id="searchInput"
      autocomplete="off"
    />
  
    <!-- Lista de sugerencias -->
    <ul
      id="suggestionList"
      class="absolute z-10 w-full mt-1 bg-white border border-gray-300 rounded-md shadow-md max-h-48 overflow-y-auto hidden"
    >
      <li class="px-4 py-2 hover:bg-blue-100 cursor-pointer;" >djaos</li>
      <li class="px-4 py-2 hover:bg-blue-100 cursor-pointer;" >djaos</li>
      <li class="px-4 py-2 hover:bg-blue-100 cursor-pointer;" >djaos</li>
    </ul>
  </div>
  
  <script>
    const list = document.getElementById("suggestionList");
    const input = document.getElementById("searchInput");
  
    input.addEventListener("focusout", () => {
      list.classList.add("hidden");
    })

    function showSuggestions(query) {
      list.classList.remove("hidden");
    }
  </script>
  

</body>

</html>
